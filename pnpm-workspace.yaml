packages:
  - "packages/*"
  - "apps/*"

# Native/postinstall builds we explicitly trust. pnpm blocks all others by
# default; better-sqlite3 and the serialport bindings must compile for the
# agent, esbuild is vitest's/vite's bundler, mongodb-memory-server
# downloads a mongod binary so the server tests are hermetic, and
# ffmpeg-static downloads the ffmpeg the agent turns camera video into the
# operator's live view with.
allowBuilds:
  esbuild: true
  better-sqlite3: true
  "@serialport/bindings-cpp": true
  mongodb-memory-server: true
  ffmpeg-static: true
